name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '27 8 * * 6'
  workflow_dispatch:
    inputs:
      languages:
        description: "Languages to analyze"
        required: true
        default: "java-kotlin"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        # For scheduled/push/PR runs there is no dispatch input, so fall back to java-kotlin.
        languages: ${{ github.event.inputs.languages || 'java-kotlin' }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: security-extended,security-and-quality

    # The project reads api keys from ../private_assets, which is added as an assets
    # source dir in build.gradle. Copy the dummy keys before building (mirrors android.yml).
    - name: Copy dummy keys2.txt
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/../private_assets"
        cp "$GITHUB_WORKSPACE/src/test/resources/keys2.txt" "$GITHUB_WORKSPACE/../private_assets"

    # Autobuild does not run the keys2.txt setup step above, so build manually.
    - name: Build with Gradle
      run: ./gradlew assembleCurrentDebug

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ github.event.inputs.languages || 'java-kotlin' }}"
